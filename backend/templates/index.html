<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniter - Shop Charging & Units</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold tracking-tight text-blue-400">Uniter ⚡</span>
            <span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">MTN & Syriatel POS</span>
        </div>
        <div class="flex items-center gap-4">
            <button id="langToggle" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">English / العربية</button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-sm md:col-span-2">
            <h2 id="titleText" class="text-lg font-semibold mb-4 text-slate-200">إدارة الشحن والوحدات (MTN & Syriatel)</h2>
            <p id="descText" class="text-slate-400 text-sm mb-6">مرحباً بك في نظام Uniter. اختر الشركة ونوع الخدمة (دفع مسبق أو لاحق) لتوليد رمز USSD والبدء بعمليات الشحن.</p>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button class="p-4 bg-slate-700 hover:bg-blue-600 hover:text-white rounded-lg border border-slate-600 transition text-center font-medium">MTN (إم تي إن)</button>
                <button class="p-4 bg-slate-700 hover:bg-red-600 hover:text-white rounded-lg border border-slate-600 transition text-center font-medium">Syriatel (سيريتل)</button>
            </div>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-sm">
            <h3 class="text-md font-semibold mb-3 text-slate-200">سجل العمليات الأخير</h3>
            <div id="activityLog" class="text-xs text-slate-400 space-y-2">
                <p>لا توجد عمليات مسجلة بعد.</p>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-500">
        Uniter Shop Charging System &bull; Phase 1 Foundation
    </footer>
</body>
</html>
