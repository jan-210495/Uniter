name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: pwsh

      - name: Build PyInstaller bundle
        run: |
          python scripts/build_exe.py
        shell: pwsh

      - name: Install Inno Setup 6
        run: |
          choco install innosetup --no-progress -y
        shell: pwsh

      - name: Compile installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\uniter.iss
          if (Test-Path "dist\UniterSetup.exe") {
            New-Item -ItemType Directory -Force -Path "installer\Output" | Out-Null
            Copy-Item "dist\UniterSetup.exe" "installer\Output\UniterSetup.exe" -Force
          }
        shell: pwsh

      - name: Upload UniterSetup.exe as GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/UniterSetup.exe

      - name: Upload UniterSetup.exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniterSetup
          path: installer/Output/UniterSetup.exe
